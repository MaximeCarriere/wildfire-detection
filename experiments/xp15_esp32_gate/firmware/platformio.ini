; XP15 stage B — PlatformIO build for the XIAO ESP32-S3 gate benchmark.
;
;   pio run -t upload && pio device monitor
;
; src_dir points at the Arduino sketch folder so there is one copy of the source:
; the same directory opens in the Arduino IDE and builds here, and make_headers.py
; writes the generated headers into it either way.

[platformio]
src_dir = xp15_gate_bench

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; A crashing sketch reboots several times a second, and each reboot re-enumerates
; the USB device, so a single connect attempt almost never lands in the ROM
; bootloader's window. Retrying repeatedly gets a board back without touching a
; button, which matters when the board is in an enclosure. A slower upload rate
; also survives a link that is being torn down underneath it.
upload_flags =
    --connect-attempts=30
upload_speed = 115200

; Rewrites the fetched esp-nn's manifest so PlatformIO builds it the way its
; CMakeLists would: S3 kernels selected, RISC-V sources skipped, private header
; directories on the include path. See the script for why each part is needed.
extra_scripts =
    pre:esp_nn_setup.py
    pre:patch_depthwise.py
    pre:patch_scratch_align.py

; The one setting that is easy to miss and fails confusingly. On the S3,
; -DBOARD_HAS_PSRAM only tells the sketch that PSRAM should exist; this line is
; what actually initialises the octal-SPI controller the XIAO's 8 MB part is wired
; to. Without it psramFound() returns false, heap_caps_alloc(MALLOC_CAP_SPIRAM)
; returns null, and the sketch stops at its FATAL line -- which looks like a code
; problem and is a build-configuration one.
board_build.arduino.memory_type = qio_opi

; 540 KB of model and frames in flash with 40 embedded frames. The default
; partition table does not leave room for it.
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -O2
    ; Global, not just in esp-nn's own flags. esp_nn.h is a dispatch header: it
    ; #defines every public name onto either the ANSI C fallback or the S3 kernels
    ; depending on this macro, and the files that include it are conv.cpp and
    ; depthwise_conv.cpp inside the *TFLite* library. Defining it only where esp-nn
    ; itself compiles builds the fast kernels and then never calls them -- the
    ; build succeeds, the answers are right, and it runs at ANSI speed.
    -DCONFIG_IDF_TARGET_ESP32S3
    ; And the switch that actually turns the optimised kernels on. esp_nn.h gates
    ; its whole dispatch block on CONFIG_NN_OPTIMIZED; without it the header takes
    ; the "reference kernels included by default" path and every name maps to
    ; _ansi, whatever the target macro says. Verified with nm on conv.cpp.o rather
    ; than by reading the timings, because both settings produce a working build
    ; and only the symbol table distinguishes them.
    -DCONFIG_NN_OPTIMIZED
    ; Route int8 convolution to esp_nn_conv_s8() instead of the reference kernel.
    ; This is the single biggest number in the whole experiment: the stock library
    ; runs this model at 20.5 s per frame, because its reference kernels are plain
    ; C loops that ignore the S3's vector unit entirely. Without this flag the
    ; board looks incapable of running the model, and it is not -- the library was
    ; leaving the hardware switched off.
    -DUSE_ESP_NN_CONV
    ; Five of this model's eleven convolutions are depthwise, and the fork only
    ; patches conv.cpp. With conv alone the board runs 4.5 s per frame; the
    ; depthwise layers sit at the widest activations and are the obvious place for
    ; the rest of it. patch_depthwise.py adds the matching dispatch.
    -DUSE_ESP_NN_DEPTHWISE

lib_deps =
    ; A fork of the community Arduino port, patched to dispatch int8 conv to
    ; ESP-NN. The upstream library is otherwise identical and builds the same
    ; sketch; it just never reaches the accelerated kernels.
    ;
    ; The patch covers conv.cpp. This model also has five depthwise separable
    ; blocks, and depthwise_conv.cpp is *not* patched, so those still run as
    ; reference C -- see the note below, because that is probably where the
    ; remaining time goes.
    https://github.com/MaximeCarriere/Arduino_TensorFlowLite_ESP32.git
    ; ESP-NN itself, which the patched conv.cpp includes as <esp_nn.h>. It is a
    ; separate Espressif component rather than part of the TFLite port, so the
    ; patch does not build without it -- the failure is a missing header, which
    ; reads like a broken fork and is a missing dependency.
    https://github.com/espressif/esp-nn.git

; ---------------------------------------------------------------------------
; Where the remaining time probably is. This model is eleven convolutions: six
; ordinary and five depthwise. -DUSE_ESP_NN_CONV accelerates the six. The five
; depthwise layers still run reference C, and they sit at the widest activation
; sizes, so they are likely the bulk of what is left. The same one-line dispatch
; in depthwise_conv.cpp to esp_nn_depthwise_conv_s8() is the obvious next patch.
;
; ---------------------------------------------------------------------------
; For a fully accelerated build, Espressif's own
; esp-tflite-micro instead, which carries the ESP-NN kernels that use the S3's
; vector instructions and is materially faster on exactly these convolutions.
; That component targets ESP-IDF rather than Arduino, so it needs:
;
;   framework = espidf
;   a CMakeLists.txt declaring esp-tflite-micro as a managed component
;   main.cpp with app_main() instead of setup()/loop(), and printf for Serial
;
; The model, the headers and the inference code itself are unchanged. Do that
; second, once the Arduino build has shown the graph lowers and the arena fits,
; and say which of the two produced any timing you report.

; ---------------------------------------------------------------------------
; Recovery environment: flash over the S3's built-in JTAG instead of the ROM
; serial bootloader.
;
;   pio run -e recover -t upload
;
; The serial bootloader has to be *entered*, either by holding BOOT as power
; arrives or by a DTR/RTS reset that esptool triggers. Neither is available if the
; board is in an enclosure and the running app never yields -- a sketch parked in
; a hold loop keeps the USB peripheral up and the ROM never runs again.
;
; JTAG does not need any of that. It halts the core through the debug unit that
; the same USB connector already exposes, so a running or crashed application is
; irrelevant. Slower to flash and it is the way back in when there is no button.
[env:recover]
extends = env:seeed_xiao_esp32s3
upload_protocol = esp-builtin
; Cleared, not inherited: extends brings the esptool flags along and OpenOCD
; rejects them outright ("unrecognized option --connect-attempts").
upload_flags =
